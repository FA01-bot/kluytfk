<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.spotify.com https://lrclib.net; img-src 'self' https://i.scdn.co data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#13795b"><title>LyricPair｜歌詞翻譯工作台</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./compact.css"><link rel="icon" href="./icon.svg">
</head>
<body>
  <main class="shell compact-shell">
    <header><a class="brand" href="./">Lyric<span>Pair</span></a><span id="configHint" class="status-pill">準備中</span></header>
    <section class="card hero">
      <div class="tabs"><button class="tab active" data-tab="link">貼 Spotify 連結</button><button class="tab" data-tab="search">搜尋歌曲</button></div>
      <form id="findForm"><input id="findInput" autocomplete="off" placeholder="https://open.spotify.com/track/…"><button class="primary">解析歌曲</button></form>
      <div id="results" class="results"></div>
    </section>
    <section id="workspace" class="hidden">
      <article class="track card"><img id="cover" alt="專輯封面"><div><h1 id="trackName"></h1><p id="trackMeta"></p><a id="spotifyLink" target="_blank" rel="noreferrer">Spotify ↗</a></div></article>
      <section class="card">
        <div class="section-head"><h2>原文</h2><span id="sourceBadge" class="badge">等待中</span></div>
        <div id="lyricsStatus" class="notice">請先選擇歌曲</div>
        <textarea id="original" rows="16" placeholder="也可以直接貼上原文"></textarea>
        <div class="actions"><button id="copyOriginal">複製原文</button><button id="copyPrompt" class="primary">複製 AI 指令</button></div>
      </section>
    </section>
    <div id="toast" role="status"></div>
  </main>
  <script src="./config.js"></script><script src="./app.js"></script>
</body></html>
